<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 時事ニュース×中学社会 10問クイズ（中2レベル）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f0fd 100%);
            min-height: 100vh;
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-6 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center">

    <!-- Main Container -->
    <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white p-6 sm:p-8 relative overflow-hidden">
            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <div class="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold tracking-wider mb-2">
                        <i data-lucide="newspaper" class="w-3.5 h-3.5"></i>
                        <span>中学2年 社会科（地理・歴史・公民）</span>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight leading-snug">
                        2026年 時事ニュース×中学社会<br class="sm:hidden"> 10問クイズ
                    </h1>
                </div>
                <!-- Score Pill -->
                <div id="score-badge" class="bg-white/15 backdrop-blur-md border border-white/25 rounded-2xl px-4 py-2.5 flex items-center gap-3 self-start sm:self-center shrink-0">
                    <div class="bg-amber-400 text-slate-900 p-1.5 rounded-xl">
                        <i data-lucide="trophy" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="text-[11px] text-blue-100 font-medium">現在のスコア</div>
                        <div class="text-lg font-black leading-none"><span id="current-score">0</span> <span class="text-xs font-normal opacity-80">/ 10</span></div>
                    </div>
                </div>
            </div>

            <!-- Progress Bar & Question Dots -->
            <div id="progress-container" class="mt-6 relative z-10">
                <div class="flex justify-between items-center text-xs font-bold text-blue-100 mb-2">
                    <span id="progress-text">第 1 問 / 全 10 問</span>
                    <span id="progress-percent">10%</span>
                </div>
                <div class="w-full bg-white/20 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
                <!-- Quick Question Status Dots -->
                <div id="question-dots" class="flex justify-between gap-1 mt-3">
                    <!-- Generated by JS -->
                </div>
            </div>
        </header>

        <!-- Quiz Body -->
        <main id="quiz-screen" class="p-6 sm:p-8">
            <!-- Category & Topic Tag -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div id="category-badge" class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-bold">
                    <!-- Dynamic Badge -->
                </div>
                <span id="question-number-label" class="text-xs font-bold text-slate-400">QUESTION 01</span>
            </div>

            <!-- Question Text -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed mb-6">
                <!-- Question loaded via JS -->
            </h2>

            <!-- Options List -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options generated via JS -->
            </div>

            <!-- Feedback & Explanation Box (Hidden until answered) -->
            <div id="explanation-box" class="hidden rounded-2xl p-5 sm:p-6 mb-6 border animate-fade-in">
                <div class="flex items-center gap-3 mb-3">
                    <div id="feedback-icon" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white shrink-0"></div>
                    <div>
                        <h3 id="feedback-title" class="font-black text-base sm:text-lg leading-tight"></h3>
                        <p id="feedback-subtitle" class="text-xs font-medium opacity-80"></p>
                    </div>
                </div>
                <div class="bg-white/80 rounded-xl p-4 border border-slate-200/70">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-indigo-600 mb-1.5">
                        <i data-lucide="book-open-check" class="w-4 h-4"></i>
                        <span>時事×教科書のポイント解説</span>
                    </div>
                    <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
                </div>
            </div>

            <!-- Navigation Footer -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                <button id="prev-btn" onclick="prevQuestion()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition disabled:opacity-30 disabled:pointer-events-none">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    <span>前の問題</span>
                </button>

                <button id="next-btn" onclick="nextQuestion()" class="hidden inline-flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200 transition">
                    <span id="next-btn-text">次の問題へ</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </main>

        <!-- Result Screen (Hidden initially) -->
        <section id="result-screen" class="hidden p-6 sm:p-8 animate-fade-in">
            <div class="text-center max-w-xl mx-auto mb-8">
                <div id="result-badge-icon" class="w-20 h-20 mx-auto mb-4 rounded-3xl flex items-center justify-center shadow-lg">
                    <!-- Icon inserted by JS -->
                </div>
                <p class="text-xs font-bold uppercase tracking-widest text-indigo-600 mb-1">RESULT SUMMARY</p>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">クイズ結果発表！</h2>
                
                <!-- Score Display -->
                <div class="my-6 bg-slate-50 border border-slate-200 rounded-3xl p-6">
                    <div class="text-sm font-bold text-slate-500 mb-1">あなたの正解数</div>
                    <div class="flex items-baseline justify-center gap-1">
                        <span id="final-score" class="text-5xl sm:text-6xl font-black text-indigo-600">0</span>
                        <span class="text-xl font-bold text-slate-400">/ 10 問</span>
                    </div>
                    <div id="evaluation-title" class="mt-3 inline-block px-4 py-1 rounded-full text-sm font-bold"></div>
                    <p id="evaluation-message" class="mt-3 text-sm text-slate-600 leading-relaxed"></p>
                </div>

                <div class="flex flex-wrap justify-center gap-3">
                    <button onclick="restartQuiz()" class="inline-flex items-center gap-2 px-6 py-3.5 rounded-2xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-200 transition">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう一度挑戦する</span>
                    </button>
                </div>
            </div>

            <!-- Review List -->
            <div class="border-t border-slate-200 pt-6">
                <h3 class="text-base font-black text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="list-checks" class="w-5 h-5 text-indigo-600"></i>
                    <span>全10問の振り返りリスト</span>
                </h3>
                <div id="review-list" class="space-y-4">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

    </div>

    <!-- Footer Note -->
    <footer class="mt-6 text-center text-xs text-slate-500">
        2026年 時事ニュース×中学社会 学習クイズ（中学2年生レベル対応）
    </footer>

    <script>
        // Exact 10 Questions Data
        const quizData = [
            {
                id: 1,
                category: "歴史",
                tag: "歴史×世界遺産",
                question: "【歴史×世界遺産】2026年7月、奈良県の「飛鳥・藤原の宮都」がユネスコの世界文化遺産に登録されました。この時代の歴史的な出来事として正しいものはどれですか？",
                options: [
                    "聖徳太子（厩戸王）が摂政となり、冠位十二階や十七条の憲法を定めた。",
                    "聖武天皇が仏教の力で国を守るため、東大寺に大仏を造らせた。",
                    "桓武天皇が仏教勢力の影響を避けるため、平安京へ都を移した。",
                    "源頼朝が鎌倉に幕府を開き、武士による政治を始めた。"
                ],
                correct: 0,
                explanation: "飛鳥時代には聖徳太子（厩戸王）や中大兄皇子らが活躍し、天皇を中心とする国づくり（律令国家の形成）が進められました。694年には日本初の本格的な都城である「藤原京」が造られました。東大寺の大仏は奈良時代（平城京）、平安京は平安時代、鎌倉幕府は鎌倉時代の出来事です。"
            },
            {
                id: 2,
                category: "地理",
                tag: "地理×資源・領土",
                question: "【地理×資源・領土】2026年2月、日本の探査船「ちきゅう」が南鳥島沖の深海から、ハイテク製品に欠かせない「レアアース（希土類）泥」を採取する試験に成功しました。南鳥島の特徴として正しいものはどれですか？",
                options: [
                    "日本最南端の島であり、周辺には広大な領海が広がっている。",
                    "日本最東端の島であり、周囲には日本の排他的経済水域（EEZ）が広がっている。",
                    "日本最西端の島であり、沖縄県に属している。",
                    "日本最北端の島であり、ロシアとの間で領土問題を抱えている。"
                ],
                correct: 1,
                explanation: "南鳥島（東京都小笠原村）は「日本最東端」の島です。沿岸から200海里（約370km）までの「排他的経済水域（EEZ）」では、水産資源や海底の鉱物資源などを開発・調査する権利が沿岸国に認められています。（最南端は沖ノ鳥島、最西端は与那国島、最北端は択捉島です）"
            },
            {
                id: 3,
                category: "地理・防災",
                tag: "地理・防災×気象情報",
                question: "【地理・防災×気象情報】2026年5月から、気象庁が発表する大雨や洪水などの「防災気象情報」が、避難行動の5段階の警戒レベルと直結する分かりやすい名称に変わりました。私たちが「危険な場所から全員避難」を完了すべきなのはどの段階ですか？",
                options: [
                    "レベル2（注意報）",
                    "レベル3（警報：高齢者等避難）",
                    "レベル4（危険警報：避難指示）",
                    "レベル5（特別警報：緊急安全確保）"
                ],
                correct: 2,
                explanation: "2026年5月の改定で、レベル4相当の情報が「〇〇危険警報」として新設されました。レベル5（特別警報）はすでに災害が発生・切迫しており移動自体が危険な状態であるため、「レベル4（危険警報／避難指示）までに全員が避難を終えること」が鉄則です。"
            },
            {
                id: 4,
                category: "公民",
                tag: "公民×法改正・交通ルール",
                question: "【公民×法改正・交通ルール】2026年4月から改正道路交通法が施行され、自転車の交通違反に対して反則金を納付させる「青切符（交通反則通告制度）」が導入されました。この制度の対象となる年齢はいくつ以上ですか？",
                options: [
                    "12歳以上（中学生以上）",
                    "16歳以上（高校生世代以上）",
                    "18歳以上（成年年齢以上）",
                    "20歳以上"
                ],
                correct: 1,
                explanation: "自転車の「青切符」は16歳以上が対象です。携帯電話を見ながら運転する「ながらスマホ」や「信号無視」「一時不停止」などが取り締まりの対象となります。自転車は道路交通法上「軽車両（車の仲間）」と位置づけられており、中学生も交通ルールを守る責任があります。"
            },
            {
                id: 5,
                category: "公民",
                tag: "公民×経済・金融政策",
                question: "【公民×経済・金融政策】2026年6月、日本の物価上昇や賃上げの動きを受けて、日本銀行（日銀）が政策金利を1％程度へと引き上げる「利上げ」を行いました。日本銀行が持つ3つの主な役割に含まれないものはどれですか？",
                options: [
                    "唯一のお札（日本銀行券）を発行する「発券銀行」",
                    "一般の銀行にお金を貸し出し、預金を受け入れる「銀行の銀行」",
                    "国の資金を管理し、金融政策を行う「政府の銀行」",
                    "私たちが使う消費税や所得税などの税率を決定する「税制の銀行」"
                ],
                correct: 3,
                explanation: "日本銀行は日本の「中央銀行」であり、「発券銀行」「銀行の銀行」「政府の銀行」という3つの役割を担い、金利の調整などで物価と景気の安定を図っています。消費税や所得税などの税金（租税）の仕組みや税率を決めるのは、国民の代表が集まる「国会」の役割です。"
            },
            {
                id: 6,
                category: "公民・歴史",
                tag: "公民・歴史×日本国憲法",
                question: "【公民・歴史×日本国憲法】2026年11月3日は、日本国憲法が「公布」されてからちょうど80年の節目にあたります。日本国憲法の「三大基本原理」の組み合わせとして正しいものはどれですか？",
                options: [
                    "国民主権・基本的人権の尊重・平和主義",
                    "三権分立・議院内閣制・地方自治",
                    "自由権・平等権・社会権",
                    "立法権・行政権・司法権"
                ],
                correct: 0,
                explanation: "日本国憲法は1946年（昭和21年）11月3日に公布され、翌1947年5月3日に施行されました。「国民主権」「基本的人権の尊重」「平和主義」は日本国憲法の三大基本原理と呼ばれ、すべての法律や政治の土台となっています。"
            },
            {
                id: 7,
                category: "公民",
                tag: "公民×労働環境・人権",
                question: "【公民×労働環境・人権】2026年10月、働く人の人権や環境を守るため、顧客からの暴言や理不尽な要求に対する対策（カスハラ対策）が企業に義務付けられ、最低賃金の引き上げ（全国平均1,177円）も行われました。日本国憲法で保障されている、働くことに関する権利はどれですか？",
                options: [
                    "参政権と請願権",
                    "勤労の権利と労働基本権（労働三権）",
                    "財産権と居住・移転の自由",
                    "思想・良心の自由と表現の自由"
                ],
                correct: 1,
                explanation: "憲法第27条では「勤労の権利」が定められ、賃金や労働時間などの基準は法律（労働基準法など）で定めることとされています。また、第28条では働く人が団結して交渉する「労働基本権（団結権・団体交渉権・団体行動権）」という社会権が保障されています。"
            },
            {
                id: 8,
                category: "地理",
                tag: "地理×世界の諸地域・北米",
                question: "【地理×世界の諸地域・北米】2026年6月〜7月、サッカーのワールドカップ（W杯）が史上初めて北米3か国で共同開催されました。この3か国（アメリカ合衆国・カナダ・メキシコ）が結んでいる自由貿易協定を何といいますか？",
                options: [
                    "EU（欧州連合）",
                    "ASEAN（東南アジア諸国連合）",
                    "USMCA（米国・メキシコ・カナダ協定）",
                    "MERCOSUR（南米南部共同市場）"
                ],
                correct: 2,
                explanation: "アメリカ・カナダ・メキシコの北米3か国は、かつてのNAFTA（北米自由貿易協定）を見直し、現在は「USMCA（米国・メキシコ・カナダ協定）」を結んで関税の撤廃や貿易のルール作りを行っています。地理の北アメリカ州の学習でも非常に重要なポイントです。"
            },
            {
                id: 9,
                category: "地理",
                tag: "地理×日本の諸地域（中部地方）",
                question: "【地理×日本の諸地域（中部地方）】2026年9月〜10月、愛知県と名古屋市を中心に「アジア競技大会」が開催され、多くのアジア諸国から選手が集まりました。開催地である愛知県（中京工業地帯）の産業の特徴として正しいものはどれですか？",
                options: [
                    "自動車産業をはじめとする機械工業が盛んで、工業出荷額が日本一である。",
                    "化学工業の割合が最も高く、石油化学コンビナートが中心である。",
                    "食料品工業が全体の半分以上を占める、軽工業中心の地域である。",
                    "鉄鋼業のみに特化しており、その他の機械工業はほとんど見られない。"
                ],
                correct: 0,
                explanation: "愛知県を中心とする「中京工業地帯」は、トヨタ自動車をはじめとする自動車工業などの輸送用機械工業が非常に盛んで、全国の工業地帯・地域の中で製造品出荷額等が第1位（日本一）となっています。"
            },
            {
                id: 10,
                category: "地理",
                tag: "地理×ヨーロッパ州・エネルギー",
                question: "【地理×ヨーロッパ州・エネルギー】2026年2月にイタリアでミラノ・コルティナ冬季五輪が開催され、6月にはスペインのサグラダ・ファミリア教会の主塔が完成して話題となりました。イタリアやスペインなどの南ヨーロッパ（地中海沿岸）の気候の特徴として正しいものはどれですか？",
                options: [
                    "一年中気温が高く、毎日スコールと呼ばれる激しい雨が降る。",
                    "夏は高温で乾燥し、冬に温暖で適度な雨が降る「地中海性気候」である。",
                    "一年中氷や雪に覆われ、樹木が育たない「寒帯」の気候である。",
                    "日本の日本海側と同じく、冬に大陸からの季節風によって大雪が降る。"
                ],
                correct: 1,
                explanation: "イタリアやスペインなどの地中海沿岸は「地中海性気候」に属します。夏は乾燥するため、乾燥に強いオリーブやブドウ、オレンジなどの栽培（地中海式農業）が盛んで、冬は比較的温暖で雨が降るのが特徴です。"
            }
        ];

        // State Variables
        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // Category Styling Helper
        function getCategoryStyle(category) {
            if (category.includes("歴史") && category.includes("公民")) {
                return { bg: "bg-purple-100 text-purple-800 border border-purple-200", icon: "scale" };
            }
            if (category.includes("歴史")) {
                return { bg: "bg-amber-100 text-amber-800 border border-amber-200", icon: "landmark" };
            }
            if (category.includes("地理")) {
                return { bg: "bg-emerald-100 text-emerald-800 border border-emerald-200", icon: "globe-2" };
            }
            return { bg: "bg-blue-100 text-blue-800 border border-blue-200", icon: "building-2" };
        }

        // Calculate Current Score
        function calculateScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === quizData[idx].correct ? 1 : 0);
            }, 0);
        }

        // Render Question Status Dots
        function renderDots() {
            const dotsContainer = document.getElementById("question-dots");
            dotsContainer.innerHTML = "";
            quizData.forEach((q, idx) => {
                const btn = document.createElement("button");
                const ans = userAnswers[idx];
                let colorClass = "bg-white/25 text-white/80";
                if (ans !== null) {
                    colorClass = ans === q.correct
