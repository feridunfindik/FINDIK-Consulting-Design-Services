<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のニュースクイズ | NewsQuest</title>
<!-- Google tag (gtag.js) — NewsQuest 計測 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JNGTF5K7F8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JNGTF5K7F8');
</script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 今日のニュースクイズ</h1>
    <p id="date-line">読み込み中…</p>
  </header>

  <!-- スタート画面 -->
  <section id="start-screen" class="card hidden">
    <p class="lead">今日のニュースTOP5から、<strong id="q-count">10</strong>問のクイズです。<br>ニュースを読んだあとに挑戦してみましょう！</p>
    <p id="streak-line" class="streak"></p>
    <button id="start-btn" class="big-btn">スタート</button>
    <p class="note"><a href="news.html">← ニュースを読む</a></p>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz-screen" class="card hidden">
    <div class="progress-wrap">
      <span id="progress-text"></span>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="score-text"></span>
    </div>
    <p id="q-source" class="q-source"></p>
    <h2 id="q-text"></h2>
    <div id="options"></div>
    <div id="feedback" class="hidden">
      <p id="feedback-mark"></p>
      <p id="feedback-exp"></p>
      <p><a id="article-link" href="#" target="_blank" rel="noopener">📰 記事を読む</a></p>
      <button id="next-btn" class="big-btn">次の問題へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="card hidden">
    <p id="result-emoji" class="result-emoji"></p>
    <h2 id="result-score"></h2>
    <p id="result-msg"></p>
    <p id="result-streak" class="streak"></p>
    <button id="retry-btn" class="big-btn">もう一度挑戦</button>
    <a id="share-btn" class="share-btn" href="#" target="_blank" rel="noopener">X でスコアをシェア</a>
    <p class="note"><a id="result-home-link" href="news.html">🗾 今日のニュースTOP5へ</a></p>
  </section>

  <!-- 準備中画面 -->
  <section id="empty-screen" class="card hidden">
    <p class="lead">🙇 今日のクイズは準備中です。<br>ニュースは毎日更新されています。</p>
    <p class="note"><a href="news.html">🗾 今日のニュースTOP5へ</a></p>
  </section>

  <footer>クイズはAIがニュース要約をもとに作成し、自動チェックを通したものです。</footer>
</div>

<script src="quiz.js"></script>
</body>
</html>
