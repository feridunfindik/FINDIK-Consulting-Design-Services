<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日更新！中学社会・時事ニュースクイズ</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            box-sizing: border-box;
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; color: var(--text-light); }
        .badge { display: inline-block; background: #e0e7ff; color: var(--primary); font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; margin-bottom: 10px; }
        .progress-bar-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .question-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-light); margin-bottom: 10px; }
        .question-text { font-size: 1.05rem; font-weight: bold; line-height: 1.5; margin-bottom: 20px; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .option-btn { background: #ffffff; border: 2px solid #cbd5e1; padding: 14px 18px; border-radius: 10px; font-size: 0.95rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text); }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0fdf4; }
        .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #166534; font-weight: bold; }
        .option-btn.incorrect { background: #fee2e2; border-color: var(--error); color: #991b1b; }
        .option-btn:disabled { cursor: default; }
        .explanation-box { background: #f1f5f9; border-left: 4px solid var(--primary); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.6; display: none; }
        .explanation-box.show { display: block; }
        .next-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; }
        .results-screen { text-align: center; display: none; }
        .score-display { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .stats-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; display: flex; justify-content: space-around; font-size: 0.9rem; }
        .stat-item span { font-weight: bold; color: var(--primary); display: block; font-size: 1.2rem; }
        .review-list { text-align: left; max-height: 200px; overflow-y: auto; margin: 15px 0; padding-right: 5px; }
        .review-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge" id="date-badge">本日分の問題</span>
        <h1>中学社会科 毎日の時事クイズ</h1>
        <div class="subtitle">2nd Grade Junior High Social Studies Daily Challenge</div>
    </header>

    <div id="quiz-screen">
        <div class="question-meta">
            <span id="question-counter">問題 1 / 10</span>
            <span id="category-tag">分野：読込中</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question-text" id="question-text">本日の問題を読み込んでいます...</div>
        
        <div class="options-grid" id="options-grid"></div>
        
        <div class="explanation-box" id="explanation-box">
            <strong>【解説】</strong><br><span id="explanation-text"></span>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ進む</button>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>本日のチャレンジ終了！</h2>
        <div class="score-display" id="final-score">0 / 10</div>
        <p id="score-message"></p>

        <!-- Stats & Average Score Box -->
        <div class="stats-box">
            <div class="stat-item">挑戦回数 <span id="stat-total">0回</span></div>
            <div class="stat-item">これまでの平均 <span id="stat-average">0.0点</span></div>
        </div>

        <h3>回答の振り返り</h3>
        <div class="review-list" id="review-list"></div>
        <button class="next-btn" style="display: block;" onclick="loadDailyQuiz()">もう一度挑戦する</button>
    </div>
</div>

<script>
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];
    let quizDate = "";

    async function loadDailyQuiz() {
        try {
            const response = await fetch('questions-latest.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Failed to load questions");
            const data = await response.json();
            
            currentQuestions = data.questions;
            quizDate = data.date;
            document.getElementById("date-badge").innerText = `📅 更新日: ${quizDate}`;
            resetQuizState();
        } catch (error) {
            document.getElementById("question-text").innerText = "本日の問題データの読み込みに失敗しました。後ほど再度お試しください。";
        }
    }

    function resetQuizState() {
        currentIndex = 0;
        score = 0;
        userAnswers = [];
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("results-screen").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("question-counter").innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("category-tag").innerText = `分野：${q.category} (${q.topic})`;
        document.getElementById("question-text").innerText = q.question;
        
        document.getElementById("progress-bar").style.width = `${(currentIndex / currentQuestions.length) * 100}%`;

        const optionsGrid = document.getElementById("options-grid");
        optionsGrid.innerHTML = "";

        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${['A', 'B', 'C', 'D'][index]}. ${option}`;
            btn.onclick = () => selectAnswer(index);
            optionsGrid.appendChild(btn);
        });

        document.getElementById("explanation-box").classList.remove("show");
        document.getElementById("next-btn").style.display = "none";
    }

    function selectAnswer(selectedIndex) {
        const q = currentQuestions[currentIndex];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (index === q.correct) btn.classList.add("correct");
            else if (index === selectedIndex) btn.classList.add("incorrect");
        });

        const isCorrect = selectedIndex === q.correct;
        if (isCorrect) score++;

        userAnswers.push({ question: q.question, selected: q.options[selectedIndex], correctOpt: q.options[q.correct], isCorrect });

        document.getElementById("explanation-text").innerText = q.explanation;
        document.getElementById("explanation-box").classList.add("show");
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) loadQuestion();
        else showResults();
    }

    function saveAndCalculateStats(currentScore) {
        // Retrieve existing history from localStorage
        let history = JSON.parse(localStorage.getItem("quiz_history") || "[]");
        
        // Push current score
        history.push({ date: quizDate || new Date().toISOString().slice(0, 10), score: currentScore });
        
        // Save back to localStorage
        localStorage.setItem("quiz_history", JSON.stringify(history));

        // Calculate statistics
        const totalQuizzes = history.length;
        const totalScoreSum = history.reduce((sum, item) => sum + item.score, 0);
        const averageScore = (totalScoreSum / totalQuizzes).toFixed(1);

        return { totalQuizzes, averageScore };
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("results-screen").style.display = "block";
        document.getElementById("final-score").innerText = `${score} / ${currentQuestions.length}`;
        document.getElementById("score-message").innerText = score === 10 ? "パーフェクト！素晴らしい時事・社会科の知識です！" : "お疲れ様でした！毎日の積み重ねで社会科の力をつけましょう！";

        // Save score & get stats
        const stats = saveAndCalculateStats(score);
        document.getElementById("stat-total").innerText = `${stats.totalQuizzes}回`;
        document.getElementById("stat-average").innerText = `${stats.averageScore}点`;

        const reviewList = document.getElementById("review-list");
        reviewList.innerHTML = "";
        userAnswers.forEach((ans, i) => {
            const item = document.createElement("div");
            item.className = "review-item";
            item.style.borderLeft = ans.isCorrect ? "4px solid var(--success)" : "4px solid var(--error)";
            item.innerHTML = `<strong>Q${i+1}: ${ans.isCorrect ? "⭕ 正解" : "❌ 不正解"}</strong><br>あなたの回答: ${ans.selected}<br>${!ans.isCorrect ? `正解: ${ans.correctOpt}` : ""}`;
            reviewList.appendChild(item);
        });
    }

    window.onload = loadDailyQuiz;
</script>
</body>
</html>
