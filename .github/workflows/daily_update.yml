name: Generate Daily Quiz with GLM

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenAI library
        run: pip install openai

      - name: Run generation script
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python generate_questions.py

      - name: Commit and push new questions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add questions-latest.json
          git commit -m "Auto-update daily quiz questions via GLM" || exit 0
          git push
          
