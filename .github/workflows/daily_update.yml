name: Generate Daily Quiz (Multi-AI)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai google-generativeai

      - name: Run generation script
        env:
          AI_PROVIDER: "groq" # <-- Change this to "zai" or "gemini" whenever you want to switch!
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_questions.py

      - name: Commit and push new questions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add questions-latest.json
          git commit -m "Auto-update daily quiz questions" || exit 0
          git push
          
